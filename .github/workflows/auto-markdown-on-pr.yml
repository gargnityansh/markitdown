name: Auto-generate Markdown for uploaded files

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:

permissions:
  contents: write

jobs:
  generate-markdown:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Convert changed files to markdown
        run: |
          changed_files=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
            while IFS= read -r -d '' file; do
              changed_files+=("$file")
            done < <(git diff --name-only --diff-filter=ACMRT -z "origin/${{ github.event.pull_request.base.ref }}...HEAD")
          else
            BEFORE_SHA="${{ github.event.before }}"
            AFTER_SHA="${{ github.sha }}"

            if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              while IFS= read -r -d '' file; do
                changed_files+=("$file")
              done < <(git ls-files -z)
            else
              while IFS= read -r -d '' file; do
                changed_files+=("$file")
              done < <(git diff --name-only --diff-filter=ACMRT -z "$BEFORE_SHA" "$AFTER_SHA")
            fi
          fi

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed files to convert."
            exit 0
          fi

          python markitdown.py "${changed_files[@]}"

      - name: Commit generated markdown files
        run: |
          if git diff --quiet; then
            echo "No markdown changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Auto-generate markdown files for uploaded content"
          git push
